[project]
name = "termin-backend"
version = "0.1.0"
description = "Manage appointments"
authors = [
    {name = "None"}
]
requires-python = ">=3.12,<4"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
